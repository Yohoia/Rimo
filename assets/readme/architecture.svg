<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="module-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.05"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#007AFF" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" font-family="-apple-system, SF Pro Display, system-ui" font-size="24" font-weight="600" fill="#000" text-anchor="middle">
    技术架构
  </text>

  <!-- Layer 1: Input Layer -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="1100" height="80" rx="8" fill="url(#module-gradient)" stroke="#007AFF" stroke-width="1" opacity="0.6"/>
    <text x="20" y="30" font-family="-apple-system, SF Pro Text, system-ui" font-size="16" font-weight="600" fill="#007AFF">
      输入层 (Input)
    </text>

    <!-- HIDMonitor -->
    <rect x="20" y="45" width="250" height="20" rx="4" fill="#007AFF" opacity="0.1"/>
    <text x="30" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      HIDMonitor · IOKit 设备管理
    </text>

    <!-- RemoteInput -->
    <rect x="290" y="45" width="250" height="20" rx="4" fill="#007AFF" opacity="0.1"/>
    <text x="300" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      RemoteInput · 按键事件解析
    </text>

    <!-- A2540Input -->
    <rect x="560" y="45" width="250" height="20" rx="4" fill="#007AFF" opacity="0.1"/>
    <text x="570" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      A2540Input · HID 报告解析
    </text>
  </g>

  <!-- Arrow from Input to Mapping -->
  <line x1="600" y1="170" x2="600" y2="195" stroke="#007AFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Layer 2: Mapping Layer -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="1100" height="80" rx="8" fill="url(#module-gradient)" stroke="#34C759" stroke-width="1" opacity="0.6"/>
    <text x="20" y="30" font-family="-apple-system, SF Pro Text, system-ui" font-size="16" font-weight="600" fill="#34C759">
      映射层 (Mapping)
    </text>

    <!-- RemoteConfiguration -->
    <rect x="20" y="45" width="320" height="20" rx="4" fill="#34C759" opacity="0.1"/>
    <text x="30" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      RemoteConfiguration · 配置序列化
    </text>

    <!-- ActionOutput -->
    <rect x="360" y="45" width="320" height="20" rx="4" fill="#34C759" opacity="0.1"/>
    <text x="370" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      ActionOutput · 系统事件生成
    </text>

    <!-- MappingView -->
    <rect x="700" y="45" width="250" height="20" rx="4" fill="#34C759" opacity="0.1"/>
    <text x="710" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      MappingView · 3D 映射界面
    </text>
  </g>

  <!-- Arrow from Mapping to App Core -->
  <line x1="600" y1="290" x2="600" y2="315" stroke="#007AFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Layer 3: App Core -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="530" height="80" rx="8" fill="url(#module-gradient)" stroke="#FF9500" stroke-width="1" opacity="0.6"/>
    <text x="20" y="30" font-family="-apple-system, SF Pro Text, system-ui" font-size="16" font-weight="600" fill="#FF9500">
      应用核心 (App)
    </text>

    <!-- RimoModel -->
    <rect x="20" y="45" width="230" height="20" rx="4" fill="#FF9500" opacity="0.1"/>
    <text x="30" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      RimoModel · 主状态管理
    </text>

    <!-- ToastCenter -->
    <rect x="270" y="45" width="240" height="20" rx="4" fill="#FF9500" opacity="0.1"/>
    <text x="280" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      ToastCenter · 通知中心
    </text>
  </g>

  <!-- Layer 4: Voice (parallel to App Core) -->
  <g transform="translate(620, 320)">
    <rect x="0" y="0" width="530" height="80" rx="8" fill="url(#module-gradient)" stroke="#FF3B30" stroke-width="1" opacity="0.6"/>
    <text x="20" y="30" font-family="-apple-system, SF Pro Text, system-ui" font-size="16" font-weight="600" fill="#FF3B30">
      语音层 (Voice)
    </text>

    <!-- VoiceController -->
    <rect x="20" y="45" width="150" height="20" rx="4" fill="#FF3B30" opacity="0.1"/>
    <text x="30" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="11" fill="#666">
      VoiceController
    </text>

    <!-- VoiceCapture -->
    <rect x="185" y="45" width="150" height="20" rx="4" fill="#FF3B30" opacity="0.1"/>
    <text x="195" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="11" fill="#666">
      VoiceCapture
    </text>

    <!-- XPC -->
    <rect x="350" y="45" width="160" height="20" rx="4" fill="#FF3B30" opacity="0.1"/>
    <text x="360" y="59" font-family="-apple-system, SF Pro Text, system-ui" font-size="11" fill="#666">
      VoiceHelper XPC
    </text>
  </g>

  <!-- Bottom: UI Layer -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="1100" height="60" rx="8" fill="url(#module-gradient)" stroke="#8E8E93" stroke-width="1" opacity="0.6"/>
    <text x="20" y="30" font-family="-apple-system, SF Pro Text, system-ui" font-size="16" font-weight="600" fill="#8E8E93">
      UI 层 (Settings)
    </text>
    <text x="20" y="48" font-family="-apple-system, SF Pro Text, system-ui" font-size="12" fill="#666">
      SettingsView · DevicePage · ScenesPage · ShortcutsPage
    </text>
  </g>

  <!-- Arrow from Core to UI -->
  <line x1="315" y1="410" x2="315" y2="425" stroke="#007AFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="885" y1="410" x2="885" y2="425" stroke="#007AFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Dark mode support -->
  <style>
    @media (prefers-color-scheme: dark) {
      text[fill="#000"] { fill: #FFFFFF; }
      text[fill="#666"] { fill: #A0A0A0; }
    }
  </style>
</svg>
